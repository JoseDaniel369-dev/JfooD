# Render blueprint for the JfooD API (free plan).
# In Render: New → Blueprint → choose this repository. Then set in the dashboard
# the two values marked `sync: false` (they are never stored in git).
services:
  - type: web
    name: jfood-api
    runtime: node
    plan: free
    # `npm ci` also builds @jfood/core (postinstall); `npm run build` builds core and api.
    buildCommand: npm ci && npm run build
    # Production: node dist/server.js. Do NOT use `npm run start:api` (development mode, tsx watch).
    startCommand: npm run start -w @jfood/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Key from https://aistudio.google.com/apikey . Without it, /recognize answers 503.
      - key: GEMINI_API_KEY
        sync: false
      # Secret shared with the app (EXPO_PUBLIC_APP_TOKEN). Make it long and random.
      - key: APP_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RECOGNIZE_DAILY_LIMIT
        value: 300
      - key: RECOGNIZE_DAILY_LIMIT_PER_IP
        value: 40
